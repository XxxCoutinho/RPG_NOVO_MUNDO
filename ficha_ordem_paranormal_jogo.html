<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ficha de Jogo | Ordem Paranormal | RPG Nexus</title>
<link href="header.css" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#05060d;
    --panel:#071120;
    --panel2:#0b1430;
    --line:#2f2a1d;
    --gold:#f5c76b;
    --gold2:#ffd782;
    --text:#f7f1e6;
    --muted:#cfd3df;
    --soft:#384355;
    --purple:#1b05c9;
    --blue:#0758ad;
    --cyan:#12aef5;
    --pink:#a2144c;
    --green:#00c26d;
    --skill-blue:#00b7ff;
    --orange:#ff9800;
  }
  body{margin:0;min-height:100vh;background:#05060d;color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
  .site-header{min-height:66px;padding:0 2.2%;display:flex;align-items:center;justify-content:space-between;gap:22px;background:#070912;border-bottom:1px solid rgba(245,199,107,.12);position:sticky;top:0;z-index:900}
  .site-logo{text-decoration:none;color:var(--gold);font-size:1.35rem;font-weight:900;letter-spacing:.02em;white-space:nowrap}
  .site-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .site-nav a,.site-nav button{font:inherit;text-decoration:none;color:#e8e8e8;background:transparent;border:0;cursor:pointer;padding:10px 12px;border-radius:8px;font-weight:800;transition:.2s ease}
  .site-nav a:hover,.site-nav button:hover{color:var(--gold);background:rgba(245,199,107,.08)}
  .site-nav a.active{color:#161616;background:var(--gold)}
  .login-btn{background:#9b1744!important;color:#fff!important;border-radius:8px!important;padding:12px 16px!important}
  .site-menu-btn{display:none;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(245,199,107,.3);font-size:1.4rem;cursor:pointer;padding:8px 12px;border-radius:10px}

  .game-shell{padding:14px 14px 18px;min-height:calc(100vh - 66px)}
  .game-layout{display:grid;grid-template-columns:minmax(360px,31.5%) minmax(390px,31.5%) minmax(430px,37%);gap:8px;max-width:1800px;margin:0 auto}
  .panel{background:#06101f;border:2px solid var(--line);border-radius:34px;min-height:calc(100vh - 96px);padding:18px 20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)}
  .panel h2,.panel-title{margin:0;color:var(--gold);font-size:1rem;text-transform:uppercase;letter-spacing:.02em;font-weight:900}
  .left-panel{display:flex;flex-direction:column;gap:14px}

  .identity-strip{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;margin-bottom:2px}
  .portrait{width:72px;height:72px;border-radius:20px;border:1px solid rgba(245,199,107,.38);background:rgba(255,255,255,.04);overflow:hidden;display:grid;place-items:center;color:var(--gold);font-weight:900}
  .portrait img{width:100%;height:100%;object-fit:cover;display:block}
  .agent-name{font-size:1.25rem;font-weight:900;color:#fff;line-height:1.1;margin:0 0 4px;word-break:break-word}
  .agent-sub{color:#cfd3df;font-size:.86rem;line-height:1.35}
  .quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .mini-btn{border:1px solid rgba(245,199,107,.28);background:rgba(245,199,107,.08);color:var(--gold);border-radius:999px;padding:7px 10px;text-decoration:none;font-weight:900;font-size:.78rem;cursor:pointer}
  .mini-btn:hover{background:rgba(245,199,107,.16)}

  .attrs-title{text-align:center;margin-top:0;margin-bottom:2px}
  .attributes{display:grid;grid-template-columns:repeat(6,1fr);grid-template-areas:". agi agi int int ." "forc forc pre pre vig vig";gap:2px 6px;align-items:center;justify-items:center;margin:-2px 0 6px}
  .attr-card{width:146px;max-width:100%;aspect-ratio:320/363;position:relative;display:grid;place-items:center;filter:drop-shadow(0 5px 6px rgba(0,0,0,.38));isolation:isolate;cursor:pointer;transition:transform .12s ease,filter .12s ease}
  .attr-card:hover{transform:translateY(-2px) scale(1.025);filter:drop-shadow(0 7px 8px rgba(0,0,0,.45)) brightness(1.04)}
  .attr-card:active{transform:translateY(0) scale(.985)}
  .attr-card[data-key="attrAgilidade"]{grid-area:agi}.attr-card[data-key="attrIntelecto"]{grid-area:int}.attr-card[data-key="attrForca"]{grid-area:forc}.attr-card[data-key="attrPresenca"]{grid-area:pre}.attr-card[data-key="attrVigor"]{grid-area:vig}
  .attr-die{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;pointer-events:none;user-select:none}
  .attr-value{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;color:#06101f;font-size:clamp(32px,4.8vw,45px);font-weight:950;line-height:1;text-align:center;letter-spacing:-.05em;text-shadow:0 1px 0 rgba(255,255,255,.14);pointer-events:none}
  .attr-abbr{position:absolute;left:50%;top:72.5%;transform:translateX(-50%);z-index:2;color:#06101f;font-size:15px;font-weight:950;line-height:1;text-align:center;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;pointer-events:none}.attr-name{display:none}

  .small-stat-row{display:grid;grid-template-columns:1fr .7fr 1fr;gap:14px;align-items:start;margin-top:0}
  .pill-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
  .pill-stat{width:100%;height:36px;border-radius:999px;background:#3b4658;display:flex;align-items:center;justify-content:center;color:var(--gold2);font-weight:900;position:relative;padding:0 12px;text-align:center}
  .pill-stat span{font-size:.9rem;margin-right:0;color:var(--gold2);line-height:1}
  .pill-stat .pill-main{font-size:1.55rem;font-weight:950;line-height:1;color:var(--gold2)}
  .pill-inline{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .nex-pill .pill-main{font-size:1.05rem}
  .pill-label{text-align:center;color:#fff;font-size:.48rem;text-transform:uppercase;font-weight:900;letter-spacing:.02em;line-height:1.05;white-space:nowrap}
  .pill-stat input{width:100%;border:0;background:transparent;color:var(--gold2);font:inherit;font-size:1.02rem;font-weight:900;line-height:1;text-align:center;outline:0;padding:0}

  .resources{display:grid;gap:7px;margin-top:28px}
  .resource{display:grid;gap:2px}
  .resource label{text-align:center;color:#fff;font-size:1rem;font-weight:900;text-transform:uppercase;line-height:1;margin:0}
  .resource-bar{position:relative;height:34px;border-radius:999px;border:2px solid var(--gold);background:#111a2b;overflow:hidden;display:grid;grid-template-columns:34px 1fr 34px;align-items:center}
  .resource-fill{position:absolute;left:0;top:0;bottom:0;width:100%;transition:.2s ease;opacity:.95}
  .resource.life .resource-fill{background:var(--purple)}
  .resource.sanity .resource-fill{background:var(--blue)}
  .resource.effort .resource-fill{background:var(--cyan)}
  .res-btn{position:relative;z-index:2;border:0;background:transparent;color:#fff;font-weight:900;font-size:1.4rem;cursor:pointer;line-height:1;height:100%}
  .res-values{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;gap:2px;color:#fff;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.55)}
  .res-values input{width:42px;border:0;border-bottom:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;text-align:center;font:inherit;font-weight:900;outline:0;padding:0}
  .res-values span{opacity:.9}

  .combat-summary{display:grid;grid-template-columns:minmax(175px,1fr) 74px 74px;gap:8px;align-items:end;margin-top:12px}
  .defense-box{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;align-items:start;grid-column:span 1;min-width:0}
  .shield{width:54px;height:66px;position:relative;display:grid;place-items:center;color:#050b17;background:transparent;overflow:visible}

  .shield input{position:relative;z-index:1;width:100%;border:0;background:transparent;color:#050b17;font-size:1.55rem;font-weight:950;text-align:center;outline:0;padding:0;margin-top:-2px;line-height:1}
  .defense-label{display:grid;gap:3px;min-width:0;justify-items:start}
  .defense-label strong{display:block;color:var(--gold);font-size:.95rem;line-height:1;text-transform:uppercase}
  .defense-formula{display:inline-grid;grid-template-columns:auto 38px 38px;gap:5px;align-items:end;color:#fff;font-size:.78rem;font-weight:900;line-height:1;min-width:0;width:max-content;justify-content:start}
  .defense-formula .formula-base{white-space:nowrap;min-width:0}
  .formula-slot{display:grid;align-items:end;min-width:0}
  .formula-slot input{width:100%;border:0;border-bottom:2px solid #b78936;background:transparent;color:#fff;font:inherit;font-size:.78rem;font-weight:900;text-align:center;outline:0;padding:0 0 2px}
  .formula-labels{display:inline-grid;grid-template-columns:auto 38px 38px;gap:5px;align-items:start;color:#fff;font-size:.48rem;font-weight:900;text-transform:uppercase;line-height:1;min-width:0;width:max-content;justify-content:start}
  .formula-labels span:first-child{visibility:hidden}
  .line-stat{display:grid;gap:7px;align-items:end;min-width:0}
  .line-stat label{color:var(--gold);font-weight:900;text-transform:uppercase;font-size:.84rem;text-align:center;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .line-stat input{width:100%;border:0;border-bottom:2px solid #b78936;background:transparent;color:#fff;outline:0;font:inherit;font-weight:900;font-size:.92rem;text-align:center;padding:3px 0 4px}
  .wide-lines{margin-top:12px;display:grid;gap:9px}
  .wide-line{display:grid;grid-template-columns:auto 1fr;gap:4px;align-items:end;color:var(--gold);font-weight:900;text-transform:uppercase}
  .wide-line input{border:0;border-bottom:2px solid #b78936;background:transparent;color:#fff;outline:0;font:inherit;padding:2px 5px}

  .skills-header{display:grid;grid-template-columns:1fr 85px 70px 64px;gap:8px;margin:0 0 12px;padding:0 12px 0 30px;color:var(--gold);font-weight:900;text-transform:uppercase;font-size:.95rem}
  .skills-list{height:auto;max-height:none;overflow:visible;padding-right:0;scrollbar-width:auto;scrollbar-color:auto}
  .skill-row{display:grid;grid-template-columns:26px minmax(128px,1fr) 78px 62px 56px;gap:7px;align-items:center;min-height:28px;font-weight:900;font-size:.93rem;color:#fff}
  .skill-row.training-5{color:var(--green)}.skill-row.training-10{color:var(--skill-blue)}.skill-row.training-15{color:var(--orange)}

  function norm(v){ return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase(); }

  function findSkill(name){ return skillList().find(s => norm(s.name) === norm(name)); }

      pe = data.peBase + pre + inc * data.pePer;
      san = data.sanBase + inc * data.sanPer;

      pe = data.peBase + pre + inc * data.pePer;

  function parsePair(value, fallback){
    if(value && typeof value === 'object' && 'cur' in value && 'max' in value) return {cur:num(value.cur), max:Math.max(1,num(value.max))};
    const text = String(value == null ? '' : value);
    const nums = text.match(/-?\d+/g) || [];
    if(nums.length >= 2) return {cur:num(nums[0]), max:Math.max(1,num(nums[1]))};
    if(nums.length === 1) return {cur:num(nums[0]), max:Math.max(1,num(nums[0]))};

  function abilityItems(raw, source){

  function normalizeAbility(a, fallbackSource){
    if(!a) return null;
    const name = a.name || a.nome || a.title || a.titulo || '';
    if(!String(name).trim()) return null;
    return {
      name:String(name).trim(),
      desc:String(a.desc || a.description || a.descricao || a.effect || a.efeito || ''),
      source:String(a.source || a.fonte || fallbackSource || 'Habilidade'),
      nex:String(a.nex || a.cost || a.custo || '')
    };
  }
  function addAbilityUnique(list, item, seen){
    const ability = normalizeAbility(item);
    if(!ability) return;
    const key = norm(ability.name) + '|' + norm(ability.source);
    if(seen.has(key)) return;
    seen.add(key);
    list.push(ability);
  }
  function abilityLibrary(){
    const list = [], seen = new Set();
    DEFAULT_ABILITY_LIBRARY.forEach(a => addAbilityUnique(list, a, seen));
    const f = fields();
    abilityItems(f.habilidadesClasse, 'Classe').forEach(a => addAbilityUnique(list, a, seen));
    abilityItems(f.habilidadesTrilha, 'Trilha').forEach(a => addAbilityUnique(list, a, seen));
    if(f.poderOrigem){
      const parts = String(f.poderOrigem).split(/\s+—\s+|\s+-\s+/);
      addAbilityUnique(list, {nex:'Origem', name:parts[0] || 'Poder da origem', desc:parts.slice(1).join(' — '), source:f.origem || 'Origem'}, seen);
    }
    ['abilityLibrary','habilidadesDisponiveis','opcoesHabilidadesClasse','opcoesHabilidadesTrilha'].forEach(key => {
      const raw = sheet && (sheet[key] || fields()[key]);
      if(Array.isArray(raw)) raw.forEach(a => addAbilityUnique(list, normalizeAbility(a, key), seen));
      else abilityItems(raw, key).forEach(a => addAbilityUnique(list, a, seen));
    });
    (sheet.powers || []).forEach(p => addAbilityUnique(list, {name:p.name, desc:p.effect, source:p.source || 'Poder', nex:p.cost || ''}, seen));
    return list.sort((a,b) => (a.source || '').localeCompare(b.source || '', 'pt-BR') || (a.name || '').localeCompare(b.name || '', 'pt-BR'));
  }
  function abilityExists(name){
    const target = norm(name);
    return allAbilities().some(a => norm(a.name) === target);
  }
  function addAbilityToSheet(ability){
    const item = normalizeAbility(ability, 'Habilidade');
    if(!item) return false;
    if(abilityExists(item.name)){
      showToast('Habilidade já está na ficha', [], 0, 0, 0, 0, 0, true);
      return false;
    }
    sheet.powers = Array.isArray(sheet.powers) ? sheet.powers : [];
    sheet.powers.push({name:item.name, source:item.source || 'Habilidade', cost:item.nex || '', effect:item.desc || ''});
    saveSheet();
    render();
    showToast('Habilidade adicionada', [], 0, 0, 0, 0, 0, true);
    return true;
  }

  function normalizeRitual(r, fallbackElement){
    if(!r) return null;
    const name = r.name || r.nome || r.title || r.titulo || '';
    if(!String(name).trim()) return null;
    return {
      name:String(name).trim(),
      element:String(r.element || r.elemento || r.source || r.fonte || fallbackElement || 'Ritual'),
      circle:String(r.circle || r.circulo || r.círculo || r.nivel || r.nível || ''),
      casting:String(r.casting || r.execucao || r.execução || ''),
      range:String(r.range || r.alcance || ''),
      target:String(r.target || r.alvo || ''),
      duration:String(r.duration || r.duracao || r.duração || ''),
      resistance:String(r.resistance || r.resistencia || r.resistência || ''),
      effect:String(r.effect || r.efeito || r.desc || r.descricao || r.descrição || '')
    };
  }
  function addRitualUnique(list, item, seen){
    const ritual = normalizeRitual(item);
    if(!ritual) return;
    const key = norm(ritual.name);
    if(seen.has(key)) return;
    seen.add(key);
    list.push(ritual);
  }
  function ritualLibrary(){
    const list = [], seen = new Set();
    DEFAULT_RITUAL_LIBRARY.forEach(r => addRitualUnique(list, r, seen));
    ['ritualLibrary','rituaisDisponiveis','opcoesRituais','ritualsLibrary'].forEach(key => {
      const raw = sheet && (sheet[key] || fields()[key]);
      if(Array.isArray(raw)) raw.forEach(r => addRitualUnique(list, normalizeRitual(r, key), seen));
    });
    return list.sort((a,b) => (a.circle || '').localeCompare(b.circle || '', 'pt-BR') || (a.element || '').localeCompare(b.element || '', 'pt-BR') || (a.name || '').localeCompare(b.name || '', 'pt-BR'));
  }
  function ritualExists(name){
    const target = norm(name);
    return (sheet.rituals || []).some(r => norm(r.name || r.nome) === target);
  }
  function addRitualToSheet(ritual){
    const item = normalizeRitual(ritual, 'Ritual');
    if(!item) return false;
    if(ritualExists(item.name)){
      showToast('Ritual já está na ficha', [], 0, 0, 0, 0, 0, true);
      return false;
    }
    sheet.rituals = Array.isArray(sheet.rituals) ? sheet.rituals : [];
    sheet.rituals.push(item);
    saveSheet();
    render();
    showToast('Ritual adicionado', [], 0, 0, 0, 0, 0, true);
    return true;
  }

    return '<div class="attr-card" data-key="'+safe(a.key)+'" data-roll-attr="'+safe(a.key)+'" title="Rolar '+safe(a.name)+' puro" role="button" tabindex="0" aria-label="Rolar '+safe(a.name)+' puro, valor '+safe(value)+'">'+
      '<img class="attr-die" src="'+ATTR_DIE_IMAGE+'" alt="" aria-hidden="true">'+
      '<div class="attr-value">'+safe(value)+'</div>'+
      '<div class="attr-abbr">'+safe(a.abbr)+'</div>'+
      '</div>';
  }
  function resourceHtml(key,label,cls){
    const r = resources[key] || {cur:0,max:1};
    const pct = Math.max(0, Math.min(100, (num(r.cur)/Math.max(1,num(r.max))) * 100));
    return '<div class="resource '+cls+'" data-resource-box="'+key+'"><label>'+label+'</label><div class="resource-bar">'+
      '<div class="resource-fill" style="width:'+pct+'%"></div>'+ 
      '<button class="res-btn" data-res-delta="-1" data-res="'+key+'" type="button">&lt;</button>'+ 
      '<div class="res-values"><input type="number" data-res-input="'+key+'" data-res-part="cur" value="'+safe(r.cur)+'"><span>/</span><input type="number" data-res-input="'+key+'" data-res-part="max" value="'+safe(r.max)+'"></div>'+ 
      '<button class="res-btn" data-res-delta="1" data-res="'+key+'" type="button">&gt;</button>'+ 
      '</div></div>';
  }
  function skillRow(s){
    const attr = attrInfo(s.attr || 'attrIntelecto');

    const cls = training === 5 ? ' training-5' : training === 10 ? ' training-10' : training >= 15 ? ' training-15' : '';

  function cleanRich(value){
    const html = String(value || '');
    if(!html) return '';
    const allowed = new Set(['b','strong','i','em','u','br','p','div','ul','ol','li']);
    const box = document.createElement('div');
    box.innerHTML = html;
    function scrub(parent){
      Array.from(parent.childNodes).forEach(node => {
        if(node.nodeType !== 1) return;
        const tag = node.tagName.toLowerCase();
        scrub(node);
        if(!allowed.has(tag)){
          while(node.firstChild) node.parentNode.insertBefore(node.firstChild, node);
          node.remove();
          return;
        }
        Array.from(node.attributes).forEach(attr => node.removeAttribute(attr.name));
      });
    }
    scrub(box);
    return box.innerHTML.trim();
  }
  function formatText(value){
    const text = String(value || '');
    if(!text.trim()) return '';
    if(/<\/?[a-z][\s\S]*>/i.test(text)) return cleanRich(text);
    return safe(text).replace(/\n/g,'<br>');
  }

  function normalizeItem(item, fallbackCategory){
    if(!item) return null;
    const name = item.name || item.nome || item.title || item.titulo || '';
    if(!String(name).trim()) return null;
    const category = String(item.category || item.categoria || fallbackCategory || 'Geral');
    const details = item.details || item.detalhes || item.desc || item.descricao || item.descrição || item.effect || item.efeito || '';
    return Object.assign({}, item, {
      name:String(name).trim(),
      category,
      qty:String(item.qty || item.quantidade || ''),
      space:String(item.space || item.spaces || item.espacos || item.espaços || ''),
      cost:String(item.cost || item.custo || item.itemCategory || item.categoriaItem || ''),
      details:String(details || '')
    });
  }
  function itemLibrary(){
    const data = {};
    ITEM_TABS.forEach(tab => { data[tab] = (DEFAULT_ITEM_LIBRARY[tab] || []).map(item => normalizeItem(item, tab)).filter(Boolean); });
    ['itemLibrary','itensDisponiveis','opcoesItens','itemsLibrary'].forEach(key => {
      const raw = sheet && sheet[key];
      if(!raw) return;
      if(Array.isArray(raw)){
        raw.forEach(item => {
          const normalized = normalizeItem(item, item.category || 'Geral');
          if(!normalized) return;
          const tab = ITEM_TABS.includes(normalized.category) ? normalized.category : 'Geral';
          data[tab].push(normalized);
        });
      }else if(typeof raw === 'object'){
        Object.keys(raw).forEach(tab => {
          const target = ITEM_TABS.includes(tab) ? tab : 'Geral';
          (Array.isArray(raw[tab]) ? raw[tab] : []).forEach(item => {
            const normalized = normalizeItem(item, target);
            if(normalized) data[target].push(normalized);
          });
        });
      }
    });
    return data;
  }
  function itemExists(name, category){

  }
  function itemMeta(item){
    const parts = [];

    add(item.category || item.categoria);

    if(item.type) add(item.type);
    if(item.damage) add('Dano ' + item.damage);
    if(item.defense) add('Defesa ' + item.defense);
    if(item.element) add(item.element);
    if(item.qty) add('Qtd. ' + item.qty);

      '<input data-edit-skill="name" value="'+safe(s.name || '')+'" aria-label="Nome da perícia">'+
      '<select data-edit-skill="attr" aria-label="Atributo-base">'+attrOptions(s.attr || 'attrIntelecto')+'</select>'+
      '<input type="number" data-edit-skill="training" value="'+safe(num(s.training))+'" aria-label="Treino">'+
      '<input type="number" data-edit-skill="bonus" value="'+safe(num(s.bonus))+'" aria-label="Bônus">'+
      '<input data-edit-skill="notes" value="'+safe(s.notes || '')+'" aria-label="Anotações">'+
      '</div>'
    ).join('');
  }

      '<div class="sheet-editor-body"><div class="editor-grid">'+

        editInput('nomeAgente','Nome')+

      '<section class="editor-section"><h3>Combate e recursos</h3><div class="editor-form-grid">'+
        editInput('deslocamento','Deslocamento')+
        editInput('protecao','Proteção')+
        editInput('resistencias','Resistências')+
        editInput('proficiencias','Proficiências')+

      '</div></section>'+
      '<section class="editor-section"><h3>Descrição</h3><div class="editor-form-grid">'+
        editArea('conceito','Conceito')+
        editArea('aparencia','Aparência')+
        editArea('personalidade','Personalidade')+

      '</div></section>'+
      '<section class="editor-section full"><h3>Perícias</h3><div class="skill-edit-list">'+skillEditorRows()+'</div></section>'+
      '</div></div>'+
      '<div class="sheet-editor-footer"><button class="editor-action" id="cancelSheetEditor" type="button">Cancelar</button><button class="editor-action primary" id="saveSheetEditor" type="button">Salvar alterações</button></div>'+
      '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    $('closeSheetEditor')?.addEventListener('click', closeSheetEditor);
    $('cancelSheetEditor')?.addEventListener('click', closeSheetEditor);
    $('saveSheetEditor')?.addEventListener('click', saveSheetEditorFromModal);
    $('sheetEditor')?.addEventListener('click', e => { if(e.target.id === 'sheetEditor') closeSheetEditor(); });
    $('removePortraitBtn')?.addEventListener('click', () => {
      fields().portraitData = '';
      const preview = $('portraitEditPreview');
      if(preview) preview.textContent = 'OP';
    });
    $('editPortraitInput')?.addEventListener('change', e => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        fields().portraitData = String(reader.result || '');
        const preview = $('portraitEditPreview');
        if(preview) preview.innerHTML = '<img src="'+safe(fields().portraitData)+'" alt="Nova imagem do personagem">';
      };
      reader.readAsDataURL(file);
    });

  function closeSheetEditor(){
    const modal = $('sheetEditor');
    if(modal) modal.remove();
  }
  function saveSheetEditorFromModal(){
    if(!sheet) return;
    sheet.fields = sheet.fields || {};
    const f = fields();
    document.querySelectorAll('#sheetEditor [data-edit-field]').forEach(input => {
      f[input.dataset.editField] = input.value;
    });
    document.querySelectorAll('#sheetEditor [data-edit-skill-row]').forEach(row => {
      const index = Number(row.dataset.editSkillRow);
      if(!Number.isFinite(index) || !sheet.skills || !sheet.skills[index]) return;
      row.querySelectorAll('[data-edit-skill]').forEach(input => {
        const key = input.dataset.editSkill;
        sheet.skills[index][key] = (key === 'training' || key === 'bonus') ? num(input.value) : input.value;
      });
    });
    saveSheet();
    saveFromInputs();
    closeSheetEditor();
    render();
    showToast('Ficha editada', [], 0, 0, 0, 0, 0, true);
  }
  function closeAbilityModals(){
    ['abilityLibraryModal','newAbilityModal','ritualLibraryModal','newRitualModal','itemLibraryModal','newItemModal'].forEach(id => { const el = $(id); if(el) el.remove(); });
  }
  function renderAbilityLibraryList(){
    const listEl = $('abilityLibraryList');
    if(!listEl) return;
    const q = norm(($('abilitySearch') && $('abilitySearch').value) || '');
    const filtered = activeAbilityLibrary.filter(a => !q || norm([a.name,a.source,a.nex,a.desc].join(' ')).includes(q));
    if(!filtered.length){
      listEl.innerHTML = '<div class="empty">Nenhuma habilidade encontrada.</div>';
      return;
    }
    listEl.innerHTML = filtered.map(a => {
      const idx = activeAbilityLibrary.indexOf(a);
      const exists = abilityExists(a.name);
      return '<article class="ability-picker-card"><div><h3>'+safe(a.name)+'</h3><small>'+safe([a.nex,a.source].filter(Boolean).join(' • '))+'</small>'+(a.desc?'<p>'+formatText(a.desc)+'</p>':'')+'</div><button class="editor-action primary" data-add-ability-index="'+idx+'" '+(exists?'disabled':'')+' type="button">'+(exists?'Já adicionada':'Adicionar')+'</button></article>';
    }).join('');
  }
  function openAbilityLibraryModal(){
    if(!sheet) return;
    closeAbilityModals();
    activeAbilityLibrary = abilityLibrary();
    const html = '<div class="sheet-editor-backdrop active" id="abilityLibraryModal" role="dialog" aria-modal="true" aria-labelledby="abilityLibraryTitle">'+
      '<div class="sheet-editor-modal">'+
      '<div class="sheet-editor-head"><h2 id="abilityLibraryTitle">Adicionar habilidade</h2><button class="editor-close" id="closeAbilityLibrary" type="button" aria-label="Fechar">×</button></div>'+
      '<div class="sheet-editor-body"><input class="ability-search" id="abilitySearch" type="search" placeholder="Buscar por nome, classe, trilha ou descrição..."><div class="ability-picker-list" id="abilityLibraryList"></div></div>'+
      '<div class="sheet-editor-footer"><button class="editor-action" id="cancelAbilityLibrary" type="button">Fechar</button></div>'+
      '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    renderAbilityLibraryList();
    $('abilitySearch')?.addEventListener('input', renderAbilityLibraryList);
    $('closeAbilityLibrary')?.addEventListener('click', closeAbilityModals);
    $('cancelAbilityLibrary')?.addEventListener('click', closeAbilityModals);
    $('abilityLibraryModal')?.addEventListener('click', e => { if(e.target.id === 'abilityLibraryModal') closeAbilityModals(); });
  }
  function openNewAbilityModal(){
    if(!sheet) return;
    closeAbilityModals();
    const html = '<div class="sheet-editor-backdrop active" id="newAbilityModal" role="dialog" aria-modal="true" aria-labelledby="newAbilityTitle">'+
      '<div class="sheet-editor-modal">'+
      '<div class="sheet-editor-head"><h2 id="newAbilityTitle">Nova habilidade</h2><button class="editor-close" id="closeNewAbility" type="button" aria-label="Fechar">×</button></div>'+
      '<div class="sheet-editor-body"><div class="editor-form-grid">'+
      '<label class="editor-field full"><span>Nome da habilidade</span><input id="newAbilityName" type="text" placeholder="Ex.: Instinto de sobrevivência"></label>'+
      '<label class="editor-field full"><span>Descrição</span><div class="rich-toolbar"><button type="button" data-rich-cmd="bold"><b>B</b></button><button type="button" data-rich-cmd="italic"><i>I</i></button><button type="button" data-rich-cmd="underline"><u>U</u></button><button type="button" data-rich-cmd="insertUnorderedList">• Lista</button></div><div id="newAbilityDesc" class="simple-rich-editor" contenteditable="true" data-placeholder="Escreva a descrição da habilidade..."></div></label>'+
      '</div></div>'+
      '<div class="sheet-editor-footer"><button class="editor-action" id="cancelNewAbility" type="button">Cancelar</button><button class="editor-action primary" id="saveNewAbility" type="button">Adicionar habilidade</button></div>'+
      '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    $('newAbilityName')?.focus();
    $('closeNewAbility')?.addEventListener('click', closeAbilityModals);
    $('cancelNewAbility')?.addEventListener('click', closeAbilityModals);
    $('newAbilityModal')?.addEventListener('click', e => { if(e.target.id === 'newAbilityModal') closeAbilityModals(); });
    document.querySelectorAll('#newAbilityModal [data-rich-cmd]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.execCommand(btn.dataset.richCmd, false, null);
        $('newAbilityDesc')?.focus();
      });
    });
    $('saveNewAbility')?.addEventListener('click', () => {
      const name = (($('newAbilityName') && $('newAbilityName').value) || '').trim();
      const desc = cleanRich(($('newAbilityDesc') && $('newAbilityDesc').innerHTML) || '');
      if(!name){
        showToast('Informe o nome da habilidade', [], 0, 0, 0, 0, 0, true);
        $('newAbilityName')?.focus();
        return;
      }
      const added = addAbilityToSheet({name, desc, source:'Personalizada', nex:''});
      if(added) closeAbilityModals();
    });
  }

  function renderRitualLibraryList(){
    const listEl = $('ritualLibraryList');
    if(!listEl) return;
    const q = norm(($('ritualSearch') && $('ritualSearch').value) || '');
    const filtered = activeRitualLibrary.filter(r => !q || norm([r.name,r.element,r.circle,r.effect].join(' ')).includes(q));
    if(!filtered.length){
      listEl.innerHTML = '<div class="empty">Nenhum ritual encontrado.</div>';
      return;
    }
    listEl.innerHTML = filtered.map(r => {
      const idx = activeRitualLibrary.indexOf(r);
      const exists = ritualExists(r.name);
      return '<article class="ability-picker-card"><div><h3>'+safe(r.name)+'</h3><small>'+safe([r.circle,r.element].filter(Boolean).join(' • '))+'</small>'+(r.effect?'<p>'+formatText(r.effect)+'</p>':'')+'</div><button class="editor-action primary" data-add-ritual-index="'+idx+'" '+(exists?'disabled':'')+' type="button">'+(exists?'Já adicionado':'Adicionar')+'</button></article>';
    }).join('');
  }
  function openRitualLibraryModal(){
    if(!sheet) return;
    closeAbilityModals();
    activeRitualLibrary = ritualLibrary();
    const html = '<div class="sheet-editor-backdrop active" id="ritualLibraryModal" role="dialog" aria-modal="true" aria-labelledby="ritualLibraryTitle">'+
      '<div class="sheet-editor-modal">'+
      '<div class="sheet-editor-head"><h2 id="ritualLibraryTitle">Adicionar ritual</h2><button class="editor-close" id="closeRitualLibrary" type="button" aria-label="Fechar">×</button></div>'+
      '<div class="sheet-editor-body"><input class="ability-search" id="ritualSearch" type="search" placeholder="Buscar por nome, elemento, círculo ou descrição..."><div class="ability-picker-list" id="ritualLibraryList"></div></div>'+
      '<div class="sheet-editor-footer"><button class="editor-action" id="cancelRitualLibrary" type="button">Fechar</button></div>'+
      '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    renderRitualLibraryList();
    $('ritualSearch')?.addEventListener('input', renderRitualLibraryList);
    $('closeRitualLibrary')?.addEventListener('click', closeAbilityModals);
    $('cancelRitualLibrary')?.addEventListener('click', closeAbilityModals);
    $('ritualLibraryModal')?.addEventListener('click', e => { if(e.target.id === 'ritualLibraryModal') closeAbilityModals(); });
  }
  function openNewRitualModal(){
    if(!sheet) return;
    closeAbilityModals();
    const html = '<div class="sheet-editor-backdrop active" id="newRitualModal" role="dialog" aria-modal="true" aria-labelledby="newRitualTitle">'+
      '<div class="sheet-editor-modal">'+
      '<div class="sheet-editor-head"><h2 id="newRitualTitle">Novo ritual</h2><button class="editor-close" id="closeNewRitual" type="button" aria-label="Fechar">×</button></div>'+
      '<div class="sheet-editor-body"><div class="editor-form-grid">'+
      '<label class="editor-field full"><span>Nome do ritual</span><input id="newRitualName" type="text" placeholder="Ex.: Selo da Névoa"></label>'+
      '<label class="editor-field full"><span>Descrição</span><div class="rich-toolbar"><button type="button" data-rich-cmd="bold"><b>B</b></button><button type="button" data-rich-cmd="italic"><i>I</i></button><button type="button" data-rich-cmd="underline"><u>U</u></button><button type="button" data-rich-cmd="insertUnorderedList">• Lista</button></div><div id="newRitualDesc" class="simple-rich-editor" contenteditable="true" data-placeholder="Escreva a descrição do ritual..."></div></label>'+
      '</div></div>'+
      '<div class="sheet-editor-footer"><button class="editor-action" id="cancelNewRitual" type="button">Cancelar</button><button class="editor-action primary" id="saveNewRitual" type="button">Adicionar ritual</button></div>'+
      '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    $('newRitualName')?.focus();
    $('closeNewRitual')?.addEventListener('click', closeAbilityModals);
    $('cancelNewRitual')?.addEventListener('click', closeAbilityModals);
    $('newRitualModal')?.addEventListener('click', e => { if(e.target.id === 'newRitualModal') closeAbilityModals(); });
    document.querySelectorAll('#newRitualModal [data-rich-cmd]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.execCommand(btn.dataset.richCmd, false, null);
        $('newRitualDesc')?.focus();
      });
    });
    $('saveNewRitual')?.addEventListener('click', () => {
      const name = (($('newRitualName') && $('newRitualName').value) || '').trim();
      const desc = cleanRich(($('newRitualDesc') && $('newRitualDesc').innerHTML) || '');
      if(!name){
        showToast('Informe o nome do ritual', [], 0, 0, 0, 0, 0, true);
        $('newRitualName')?.focus();
        return;
      }
      const added = addRitualToSheet({name, effect:desc, element:'Personalizado', circle:''});
      if(added) closeAbilityModals();
    });
  }

  function attachDynamicHandlers(){
    $('editSheetBtn')?.addEventListener('click', openSheetEditor);
    $('savePlayBtn')?.addEventListener('click', () => { saveFromInputs(); showToast('Ficha de jogo salva', [], 0, 0, 0, 0, 0, true); });
    $('addAbilityBtn')?.addEventListener('click', openAbilityLibraryModal);
    $('newAbilityBtn')?.addEventListener('click', openNewAbilityModal);
    $('addRitualBtn')?.addEventListener('click', openRitualLibraryModal);
    $('newRitualBtn')?.addEventListener('click', openNewRitualModal);
    $('addItemBtn')?.addEventListener('click', openItemLibraryModal);
    $('newItemBtn')?.addEventListener('click', openNewItemModal);
    document.querySelectorAll('[data-notes-cmd]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.execCommand(btn.dataset.notesCmd, false, null);
        const editor = $('notesEditor');
        if(editor){
          editor.focus();
          play.notes = cleanRich(editor.innerHTML);
          savePlay();
        }
      });
    });
    const notesEditor = $('notesEditor');
    if(notesEditor){
      notesEditor.addEventListener('input', () => {
        play.notes = cleanRich(notesEditor.innerHTML);
        savePlay();
      });
      notesEditor.addEventListener('blur', () => {
        play.notes = cleanRich(notesEditor.innerHTML);
        notesEditor.innerHTML = play.notes;
        savePlay();
      });
    }
  }
  function saveFromInputs(){
    play.stats = play.stats || {};
    document.querySelectorAll('[data-play-stat]').forEach(input => { play.stats[input.dataset.playStat] = input.value; });
    const notesEditor = $('notesEditor');
    if(notesEditor) play.notes = cleanRich(notesEditor.innerHTML);
    play.resources = resources;
    savePlay();
  }
  function updateResourceUi(key){
    const box = document.querySelector('[data-resource-box="'+CSS.escape(key)+'"]');
    if(!box) return;
    const r = resources[key] || {cur:0,max:1};
    const pct = Math.max(0, Math.min(100, (num(r.cur)/Math.max(1,num(r.max))) * 100));
    const fill = box.querySelector('.resource-fill');
    if(fill) fill.style.width = pct + '%';
    box.querySelectorAll('[data-res-input]').forEach(input => { input.value = r[input.dataset.resPart]; });
  }
  function rollSkill(name){
    const skill = findSkill(name); if(!skill) return;
    const attr = attrValue(skill.attr || 'attrIntelecto');
    const qty = attr === 0 ? 2 : Math.max(1, attr);
    const rolls = Array.from({length:qty}, () => rand(20));
    const chosen = attr === 0 ? Math.min(...rolls) : Math.max(...rolls);
    const training = num(skill.training), bonus = num(skill.bonus);
    const total = chosen + training + bonus;
    showToast((skill.name || '').toLocaleLowerCase('pt-BR') + ' - ' + total, rolls, chosen, training, bonus, total, false);
  }
  function rollAttribute(key){
    const attr = attrInfo(key);
    const value = attrValue(key);
    const qty = value === 0 ? 2 : Math.max(1, value);
    const rolls = Array.from({length:qty}, () => rand(20));
    const chosen = value === 0 ? Math.min(...rolls) : Math.max(...rolls);
    const total = chosen;
    showToast(attr.name.toLocaleLowerCase('pt-BR') + ' - ' + total, rolls, chosen, 0, 0, total, false);
  }
  function showToast(title, rolls, chosen, training, bonus, total, simple){
    const toast = $('rollToast'); if(!toast) return;
    toast.innerHTML = '<button type="button" aria-label="Fechar">×</button><strong>'+safe(title)+'</strong>' + (simple ? '<span>Alterações salvas neste navegador.</span>' : '<span>( '+safe(rolls.join(', '))+' )</span><span>('+safe(chosen)+' + '+safe(training)+' + '+safe(bonus)+') = '+safe(total)+'</span>');
    toast.classList.add('active');
    toast.querySelector('button').onclick = () => toast.classList.remove('active');
    clearTimeout(toast._timer); toast._timer = setTimeout(()=>toast.classList.remove('active'), simple ? 2500 : 12000);
  }
  document.addEventListener('click', e => {
    const addItem = e.target.closest('[data-add-item-index]');
    if(addItem){
      const idx = Number(addItem.dataset.addItemIndex);
      const item = (activeItemLibrary[activeItemTab] || [])[idx];
      if(item && addItemToSheet(item)) closeAbilityModals();
      return;
    }
    const addRitual = e.target.closest('[data-add-ritual-index]');
    if(addRitual){
      const idx = Number(addRitual.dataset.addRitualIndex);
      const ritual = activeRitualLibrary[idx];
      if(ritual && addRitualToSheet(ritual)) closeAbilityModals();
      return;
    }
    const addAbility = e.target.closest('[data-add-ability-index]');
    if(addAbility){
      const idx = Number(addAbility.dataset.addAbilityIndex);
      const ability = activeAbilityLibrary[idx];
      if(ability && addAbilityToSheet(ability)) closeAbilityModals();
      return;
    }
    const tab = e.target.closest('[data-tab]');
    if(tab){
      const name = tab.dataset.tab;
      document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active', b === tab));
      document.querySelectorAll('[data-pane]').forEach(p=>p.classList.toggle('active', p.dataset.pane === name));
      document.querySelectorAll('[data-toolbar]').forEach(g=>g.classList.toggle('active', g.dataset.toolbar === name));
      return;
    }
    const attrRoll = e.target.closest('[data-roll-attr]');
    if(attrRoll){ e.preventDefault(); rollAttribute(attrRoll.dataset.rollAttr); return; }
    const roll = e.target.closest('[data-roll-skill]');
    if(roll){ e.preventDefault(); rollSkill(roll.dataset.rollSkill); return; }
    const deltaBtn = e.target.closest('[data-res-delta]');
    if(deltaBtn){
      const key = deltaBtn.dataset.res;
      resources[key] = resources[key] || {cur:0,max:1};
      resources[key].cur = Math.max(0, num(resources[key].cur) + num(deltaBtn.dataset.resDelta));
      updateResourceUi(key); saveFromInputs(); return;
    }
  });
  document.addEventListener('input', e => {
    const res = e.target.closest('[data-res-input]');
    if(res){
      const key = res.dataset.resInput;
      const part = res.dataset.resPart;
      resources[key] = resources[key] || {cur:0,max:1};
      resources[key][part] = num(res.value);
      if(part === 'max') resources[key].max = Math.max(1, num(res.value));
      if(part === 'cur') resources[key].cur = Math.max(0, num(res.value));
      updateResourceUi(key); saveFromInputs(); return;
    }
    if(e.target.matches('[data-play-stat]')){
      saveFromInputs();
    }
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeSheetEditor(); closeAbilityModals(); } });
  document.addEventListener('keydown', e => {
    const attrRoll = e.target.closest && e.target.closest('[data-roll-attr]');
    if(attrRoll && (e.key === 'Enter' || e.key === ' ')){
      e.preventDefault();
      rollAttribute(attrRoll.dataset.rollAttr);
    }
  });
  render();
})();
</script>
