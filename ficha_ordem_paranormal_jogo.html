  body::after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 24%,rgba(123,16,26,.16),transparent 38%),linear-gradient(180deg,rgba(2,4,11,.36),rgba(2,4,11,.70));z-index:-1;pointer-events:none}
  .site-header{min-height:66px;padding:0 2.2%;display:flex;align-items:center;justify-content:space-between;gap:22px;background:rgba(7,9,18,.82);backdrop-filter:blur(8px);border-bottom:1px solid rgba(245,199,107,.18);position:sticky;top:0;z-index:900}
  .site-logo{text-decoration:none;color:var(--gold);font-size:1.35rem;font-weight:900;letter-spacing:.02em;white-space:nowrap}
  .site-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .site-nav a,.site-nav button{font:inherit;text-decoration:none;color:#e8e8e8;background:transparent;border:0;cursor:pointer;padding:10px 12px;border-radius:8px;font-weight:800;transition:.2s ease}
  .site-nav a:hover,.site-nav button:hover{color:var(--gold);background:rgba(245,199,107,.08)}
  .site-nav a.active{color:#161616;background:var(--gold)}
  .login-btn{background:#9b1744!important;color:#fff!important;border-radius:8px!important;padding:12px 16px!important}
  #loginLink.login-btn,.site-nav a.login-btn{display:inline-flex!important;align-items:center;justify-content:center;visibility:visible!important;opacity:1!important;white-space:nowrap}
  .logout-btn{display:none;background:#171a24!important;color:#fff!important;border:1px solid rgba(255,255,255,.14)!important;border-radius:8px!important;padding:12px 16px!important;font-weight:900!important;white-space:nowrap}
  .logout-btn:hover{background:#232838!important;color:#fff!important}
  .site-menu-btn{display:none;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(245,199,107,.3);font-size:1.4rem;cursor:pointer;padding:8px 12px;border-radius:10px}

  .game-shell{padding:14px 14px 18px;min-height:calc(100vh - 66px);position:relative;z-index:1}
  .game-layout{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,.9fr) minmax(0,1.1fr);gap:8px;width:100%;max-width:1800px;margin:0 auto;align-items:start}
  .panel{background:linear-gradient(180deg,rgba(6,16,31,.78),rgba(6,16,31,.64));border:2px solid rgba(188,141,56,.28);border-radius:34px;min-height:calc(100vh - 96px);padding:18px 20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.035),0 18px 60px rgba(0,0,0,.30);min-width:0;overflow:hidden;backdrop-filter:blur(2px)}
  .panel h2,.panel-title{margin:0;color:var(--gold);font-size:1rem;text-transform:uppercase;letter-spacing:.02em;font-weight:900}
  .left-panel{display:flex;flex-direction:column;gap:14px;min-width:0;container-type:inline-size}

  .identity-strip{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;margin-bottom:2px}
  .portrait{width:72px;height:72px;border-radius:20px;border:1px solid rgba(245,199,107,.38);background:rgba(255,255,255,.04);overflow:hidden;display:grid;place-items:center;color:var(--gold);font-weight:900}
  .portrait img{width:100%;height:100%;object-fit:cover;display:block}
  .agent-name{font-size:1.25rem;font-weight:900;color:#fff;line-height:1.1;margin:0 0 4px;word-break:break-word}
  .agent-sub{color:#cfd3df;font-size:.86rem;line-height:1.35}
  .quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .mini-btn{border:1px solid rgba(245,199,107,.28);background:rgba(245,199,107,.08);color:var(--gold);border-radius:999px;padding:7px 10px;text-decoration:none;font-weight:900;font-size:.78rem;cursor:pointer}
  .mini-btn:hover{background:rgba(245,199,107,.16)}

  .attrs-title{text-align:center;margin-top:0;margin-bottom:2px}
  .attributes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-areas:". agi agi int int ." "forc forc pre pre vig vig";gap:2px 6px;align-items:center;justify-items:center;margin:-2px 0 6px;width:100%;max-width:100%}
  .attr-card{width:min(146px,100%);min-width:0;aspect-ratio:320/363;position:relative;display:grid;place-items:center;filter:drop-shadow(0 5px 6px rgba(0,0,0,.38));isolation:isolate;cursor:pointer;transition:transform .12s ease,filter .12s ease}
  .attr-card:hover{transform:translateY(-2px) scale(1.025);filter:drop-shadow(0 7px 8px rgba(0,0,0,.45)) brightness(1.04)}
  .attr-card:active{transform:translateY(0) scale(.985)}
  .attr-card[data-key="attrAgilidade"]{grid-area:agi}.attr-card[data-key="attrIntelecto"]{grid-area:int}.attr-card[data-key="attrForca"]{grid-area:forc}.attr-card[data-key="attrPresenca"]{grid-area:pre}.attr-card[data-key="attrVigor"]{grid-area:vig}
  .attr-die{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;pointer-events:none;user-select:none}
  .attr-value{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;color:#06101f;font-size:clamp(25px,10cqw,45px);font-weight:950;line-height:1;text-align:center;letter-spacing:-.05em;text-shadow:0 1px 0 rgba(255,255,255,.14);pointer-events:none}
  .attr-abbr{position:absolute;left:50%;top:72.5%;transform:translateX(-50%);z-index:2;color:#06101f;font-size:clamp(10px,3.6cqw,15px);font-weight:950;line-height:1;text-align:center;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;pointer-events:none}.attr-name{display:none}

  .small-stat-row{display:grid;grid-template-columns:1fr .7fr 1fr;gap:14px;align-items:start;margin-top:0}
  .pill-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
  .pill-stat{width:100%;height:36px;border-radius:999px;background:rgba(59,70,88,.76);display:flex;align-items:center;justify-content:center;color:var(--gold2);font-weight:900;position:relative;padding:0 12px;text-align:center}
  .pill-stat span{font-size:.9rem;margin-right:0;color:var(--gold2);line-height:1}
  .pill-stat .pill-main{font-size:1.55rem;font-weight:950;line-height:1;color:var(--gold2)}
  .pill-inline{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .nex-pill .pill-main{font-size:1.05rem}
  .pill-label{text-align:center;color:#fff;font-size:.48rem;text-transform:uppercase;font-weight:900;letter-spacing:.02em;line-height:1.05;white-space:nowrap}
  .pill-stat input{width:100%;border:0;background:transparent;color:var(--gold2);font:inherit;font-size:1.02rem;font-weight:900;line-height:1;text-align:center;outline:0;padding:0}

  .resources{display:grid;gap:7px;margin-top:28px}
  .resource{display:grid;gap:2px}
  .resource label{text-align:center;color:#fff;font-size:1rem;font-weight:900;text-transform:uppercase;line-height:1;margin:0}
  .resource-bar{position:relative;height:34px;border-radius:999px;border:2px solid var(--gold);background:rgba(17,26,43,.74);overflow:hidden;display:grid;grid-template-columns:34px 1fr 34px;align-items:center}
  .resource-fill{position:absolute;left:0;top:0;bottom:0;width:100%;transition:.2s ease;opacity:.95}
  .resource.life .resource-fill{background:var(--purple)}
  .resource.sanity .resource-fill{background:var(--blue)}
  .resource.effort .resource-fill{background:var(--cyan)}
  .res-btn{position:relative;z-index:2;border:0;background:transparent;color:#fff;font-weight:900;font-size:1.4rem;cursor:pointer;line-height:1;height:100%}
  .res-values{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;gap:2px;color:#fff;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.55)}
  .res-values input{width:42px;border:0;border-bottom:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;text-align:center;font:inherit;font-weight:900;outline:0;padding:0}
  .res-values span{opacity:.9}

  .combat-summary{display:grid;grid-template-columns:minmax(175px,1fr) 74px 74px;gap:8px;align-items:end;margin-top:12px}
  .defense-box{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;align-items:start;grid-column:span 1;min-width:0}
  .shield{width:54px;height:66px;position:relative;display:grid;place-items:center;color:#050b17;background:transparent;overflow:visible}

  .shield input{position:relative;z-index:1;width:100%;border:0;background:transparent;color:#050b17;font-size:1.55rem;font-weight:950;text-align:center;outline:0;padding:0;margin-top:-2px;line-height:1}
  .defense-label{display:grid;gap:3px;min-width:0;justify-items:start}
  .defense-label strong{display:block;color:var(--gold);font-size:.95rem;line-height:1;text-transform:uppercase}
  .defense-formula{display:inline-grid;grid-template-columns:auto 38px 38px;gap:5px;align-items:end;color:#fff;font-size:.78rem;font-weight:900;line-height:1;min-width:0;width:max-content;justify-content:start}
  .defense-formula .formula-base{white-space:nowrap;min-width:0}
  .formula-slot{display:grid;align-items:end;min-width:0}
  .formula-slot input{width:100%;border:0;border-bottom:2px solid #b78936;background:transparent;color:#fff;font:inherit;font-size:.78rem;font-weight:900;text-align:center;outline:0;padding:0 0 2px}
  .formula-labels{display:inline-grid;grid-template-columns:auto 38px 38px;gap:5px;align-items:start;color:#fff;font-size:.48rem;font-weight:900;text-transform:uppercase;line-height:1;min-width:0;width:max-content;justify-content:start}
  .formula-labels span:first-child{visibility:hidden}
  .line-stat{display:grid;gap:7px;align-items:end;min-width:0}
  .line-stat label{color:var(--gold);font-weight:900;text-transform:uppercase;font-size:.84rem;text-align:center;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .line-stat input{width:100%;border:0;border-bottom:2px solid #b78936;background:transparent;color:#fff;outline:0;font:inherit;font-weight:900;font-size:.92rem;text-align:center;padding:3px 0 4px}
  .wide-lines{margin-top:12px;display:grid;gap:9px}
  .wide-line{display:grid;grid-template-columns:auto 1fr;gap:4px;align-items:end;color:var(--gold);font-weight:900;text-transform:uppercase}
  .wide-line input{border:0;border-bottom:2px solid #b78936;background:transparent;color:#fff;outline:0;font:inherit;padding:2px 5px}

  .skills-header{display:grid;grid-template-columns:minmax(0,1fr) minmax(56px,.42fr) minmax(48px,.34fr) minmax(46px,.32fr);gap:clamp(4px,.45vw,8px);margin:0 0 12px;padding:0 8px 0 28px;color:var(--gold);font-weight:900;text-transform:uppercase;font-size:clamp(.74rem,.82vw,.95rem);min-width:0}
  .skills-list{height:auto;max-height:none;overflow:visible;padding-right:0;scrollbar-width:auto;scrollbar-color:auto}
  .skill-row{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(52px,.42fr) minmax(42px,.32fr) minmax(38px,.28fr);gap:clamp(3px,.45vw,7px);align-items:center;min-height:28px;font-weight:900;font-size:clamp(.76rem,.82vw,.93rem);color:#fff;min-width:0}
  .skill-row.training-5{color:var(--green)}.skill-row.training-10{color:var(--skill-blue)}.skill-row.training-15{color:var(--orange)}
  .skill-roll{border:0;background:transparent;color:inherit;cursor:pointer;font-size:1rem;width:22px;height:22px;display:grid;place-items:center;padding:0;opacity:.96}
  .skill-roll:hover{transform:scale(1.1)}
  .skill-row > *{min-width:0}.skill-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.skill-attr,.skill-training,.skill-bonus{text-align:center;border-bottom:1px solid currentColor;line-height:1.1;padding-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.skill-notes{display:none}

  .tabs{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 20px}
  .tab-btn{background:transparent;border:0;color:var(--gold);font-weight:900;text-transform:uppercase;font-size:.92rem;padding:4px 0 7px;cursor:pointer;border-bottom:3px solid transparent}
  .tab-btn.active{border-color:var(--gold);color:#fff}
  .tab-pane{display:none}.tab-pane.active{display:block}
  .tab-toolbar{display:flex;justify-content:flex-end;gap:8px;margin:-6px 0 16px;flex-wrap:wrap}
  .toolbar-group{display:none;justify-content:flex-end;gap:8px;flex-wrap:wrap;width:100%}
  .toolbar-group.active{display:flex}
  .soft-btn{border:0;background:#394356;color:#fff;border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer}.soft-btn:hover{filter:brightness(1.08)}
  .soft-btn.gold{background:var(--gold);color:#071120}
  .ability-picker-list{display:grid;gap:10px;max-height:52vh;overflow:auto;padding-right:4px}
  .ability-picker-card{border:1px solid rgba(245,199,107,.28);border-radius:16px;background:rgba(17,25,54,.74);padding:12px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
  .ability-picker-card h3{margin:0 0 4px;color:#fff;font-size:.98rem}
  .ability-picker-card small{display:block;color:#d9b669;font-weight:950;text-transform:uppercase;font-size:.68rem;letter-spacing:.03em}
  .ability-picker-card p{margin:6px 0 0;color:#dfe4ee;font-size:.86rem;line-height:1.35}
  .ability-picker-card .editor-action{align-self:center;white-space:nowrap;padding:8px 12px;font-size:.78rem}
  .ability-picker-card .editor-action[disabled]{opacity:.48;cursor:not-allowed;filter:none}
  .ability-search{width:100%;border:1px solid rgba(245,199,107,.32);border-radius:999px;background:#071120;color:#fff;padding:11px 14px;font-weight:850;outline:0;margin-bottom:12px}
  .item-library-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  .item-library-tab{border:1px solid rgba(245,199,107,.32);background:#071120;color:var(--gold);border-radius:999px;padding:9px 12px;font-weight:950;cursor:pointer;text-transform:uppercase;font-size:.76rem}
  .item-library-tab.active{background:var(--gold);color:#071120;border-color:var(--gold)}
  .new-item-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;grid-column:1/-1}
  .new-item-fields .editor-field.full{grid-column:1/-1}
  .new-item-fields .editor-field.wide{grid-column:span 2}
  .item-modal-note{color:#cfd3df;font-size:.82rem;line-height:1.35;margin:0 0 12px}
  .item-meta-line{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .item-meta-line span{border:1px solid rgba(245,199,107,.20);background:rgba(245,199,107,.07);border-radius:999px;padding:3px 7px;color:#f5d99b;font-size:.68rem;font-weight:900;text-transform:uppercase}
  @media(max-width:720px){.new-item-fields{grid-template-columns:1fr}.new-item-fields .editor-field.wide{grid-column:1/-1}}
  .rich-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
  .rich-toolbar button{border:1px solid rgba(245,199,107,.28);background:#071120;color:#fff;border-radius:9px;min-width:34px;height:32px;font-weight:950;cursor:pointer}
  .rich-toolbar button:hover{background:rgba(245,199,107,.12)}
  .simple-rich-editor{min-height:150px;border:1px solid rgba(245,199,107,.32);border-radius:14px;background:rgba(7,17,32,.76);color:#fff;padding:12px;font-size:.92rem;font-weight:700;line-height:1.45;outline:0;overflow:auto}
  .simple-rich-editor:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,199,107,.12)}
  .notes-pane{display:grid;gap:10px}
  .notes-editor{min-height:420px;max-height:none;width:100%;font-size:.95rem;font-weight:700}
  .notes-editor:empty:before{content:attr(data-placeholder);color:#7f8796;font-weight:800}
  .notes-hint{color:#cfd3df;font-size:.78rem;line-height:1.35;margin:0}
  .simple-rich-editor:empty:before{content:attr(data-placeholder);color:#8e96a8}
  .card-list{display:grid;gap:10px;max-height:calc(100vh - 170px);overflow:auto;padding-right:4px}
  .game-card{border:2px solid #bc8d38;border-radius:16px;background:rgba(17,25,54,.68);padding:14px 16px;color:#fff;line-height:1.35}
  .game-card h3{margin:0 0 4px;font-size:1rem;color:#fff}.game-card p{margin:4px 0 0;color:#e6e8ef;font-size:.9rem}.game-card small{color:#d9b669;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
  .empty{border:1px dashed rgba(245,199,107,.35);border-radius:16px;padding:16px;color:#cfd3df;background:rgba(255,255,255,.035);line-height:1.45}
  .desc-grid{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:start}.desc-portrait{width:100%;aspect-ratio:3/4;border-radius:18px;border:1px solid rgba(245,199,107,.32);background:rgba(255,255,255,.05);overflow:hidden;display:grid;place-items:center;color:var(--gold);font-weight:900;text-align:center;padding:10px}.desc-portrait img{width:100%;height:100%;object-fit:cover;display:block}.desc-block{margin-bottom:12px}.desc-block strong{display:block;color:var(--gold);margin-bottom:4px;text-transform:uppercase;font-size:.8rem}.desc-block div{color:#e5e7ef;line-height:1.45;white-space:pre-wrap}


  .sheet-editor-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:3000;display:none;align-items:center;justify-content:center;padding:18px}
  .sheet-editor-backdrop.active{display:flex}
  .sheet-editor-modal{width:min(1040px,100%);max-height:92vh;overflow:hidden;border:2px solid rgba(245,199,107,.52);border-radius:24px;background:linear-gradient(180deg,rgba(11,20,48,.94),rgba(5,9,19,.94));box-shadow:0 28px 100px rgba(0,0,0,.72);display:flex;flex-direction:column;color:#fff;backdrop-filter:blur(8px)}
  .sheet-editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid rgba(245,199,107,.22)}
  .sheet-editor-head h2{margin:0;color:var(--gold);font-size:1.1rem;text-transform:uppercase;letter-spacing:.03em;font-weight:950}
  .editor-close{border:0;background:transparent;color:#fff;font-size:1.8rem;line-height:1;cursor:pointer;border-radius:10px;padding:2px 8px;opacity:.86}
  .editor-close:hover{background:rgba(255,255,255,.08);opacity:1}
  .sheet-editor-body{overflow:auto;padding:16px 18px 18px}
  .editor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .editor-section{border:1px solid rgba(245,199,107,.24);border-radius:18px;background:rgba(255,255,255,.04);padding:14px}
  .editor-section.full{grid-column:1/-1}
  .editor-section h3{margin:0 0 12px;color:var(--gold2);font-size:.95rem;text-transform:uppercase;font-weight:950;letter-spacing:.02em}
  .editor-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .editor-field{display:grid;gap:5px;color:#fff;font-size:.76rem;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
  .editor-field.full{grid-column:1/-1}
  .editor-field input,.editor-field select,.editor-field textarea{width:100%;border:1px solid rgba(245,199,107,.32);border-radius:12px;background:rgba(7,17,32,.86);color:#fff;padding:9px 10px;font:inherit;font-size:.9rem;font-weight:800;text-transform:none;outline:0}
  .editor-field textarea{min-height:84px;resize:vertical;line-height:1.35}
  .editor-field input:focus,.editor-field select:focus,.editor-field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,199,107,.12)}
  .portrait-edit-row{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;margin-bottom:10px}
  .portrait-edit-preview{width:72px;height:72px;border-radius:18px;border:1px solid rgba(245,199,107,.38);background:rgba(255,255,255,.05);display:grid;place-items:center;overflow:hidden;color:var(--gold);font-weight:950}
  .portrait-edit-preview img{width:100%;height:100%;object-fit:cover;display:block}
  .editor-help{color:#cfd3df;font-size:.82rem;line-height:1.35;margin:0}
  .skill-edit-list{display:grid;gap:7px;max-height:330px;overflow:auto;padding-right:3px}
  .skill-edit-row{display:grid;grid-template-columns:minmax(130px,1.3fr) 96px 78px 78px minmax(120px,1fr);gap:7px;align-items:center}
  .skill-edit-row input,.skill-edit-row select{min-width:0;border:1px solid rgba(245,199,107,.28);border-radius:10px;background:#071120;color:#fff;padding:8px;font-weight:850;outline:0}
  .skill-edit-head{color:var(--gold);font-weight:950;text-transform:uppercase;font-size:.75rem}
  .sheet-editor-footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid rgba(245,199,107,.22);background:rgba(0,0,0,.15)}
  .editor-action{border:0;border-radius:999px;padding:10px 16px;font-weight:950;cursor:pointer;color:#fff;background:#394356}
  .editor-action.primary{background:var(--gold);color:#071120}
  .editor-action.danger{background:rgba(162,20,76,.75);color:#fff}
  .editor-action:hover{filter:brightness(1.08)}

  .toast{position:fixed;right:22px;bottom:22px;width:min(380px,calc(100vw - 34px));border:1px solid rgba(245,199,107,.44);background:linear-gradient(180deg,rgba(25,31,58,.98),rgba(8,10,18,.98));box-shadow:0 24px 80px rgba(0,0,0,.55);border-radius:18px;padding:16px 42px 16px 18px;z-index:2000;display:none}.toast.active{display:block;animation:toastIn .18s ease-out}.toast strong{display:block;color:var(--gold);font-size:1.24rem;margin-bottom:8px}.toast span{display:block;color:#fff;font-weight:800;margin-top:4px}.toast button{position:absolute;right:10px;top:8px;background:transparent;border:0;color:#fff;font-size:1.4rem;cursor:pointer}@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .missing{max-width:900px;margin:46px auto;background:#06101f;border:2px solid var(--line);border-radius:28px;padding:28px;color:#fff;line-height:1.55}.missing h1{color:var(--gold);margin:0 0 10px}.missing a{color:var(--gold)}

  @media(max-width:1480px) and (min-width:1251px){.game-layout{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr)}.game-layout>.panel:nth-child(3){grid-column:1/-1}.attributes{max-width:560px;margin-left:auto;margin-right:auto}.combat-summary{max-width:620px}}
  @media(max-width:1250px){.game-layout{grid-template-columns:1fr}.panel{min-height:auto}.skills-list,.card-list{height:auto;max-height:none}.attributes{max-width:560px;margin-left:auto;margin-right:auto}.combat-summary{max-width:620px}.desc-grid{grid-template-columns:150px 1fr}}
  @media(max-width:720px){.site-header{padding:12px 4%;min-height:auto;align-items:flex-start}.site-menu-btn{display:block}.site-nav{display:none;width:100%;flex-direction:column;align-items:stretch;background:#070912;border:1px solid rgba(245,199,107,.20);padding:10px;margin-top:12px}.site-nav.active{display:flex}.site-nav a,.site-nav button{text-align:left;width:100%}.game-shell{padding:10px}.panel{border-radius:22px;padding:14px}.identity-strip{grid-template-columns:58px 1fr}.portrait{width:58px;height:58px;border-radius:16px}.attributes{grid-template-columns:repeat(2,1fr);grid-template-areas:"agi int" "forc pre" "vig vig";gap:8px}.attr-card{width:min(126px,100%)}.small-stat-row{grid-template-columns:1fr}.combat-summary{grid-template-columns:1fr 1fr}.defense-box{grid-template-columns:54px minmax(0,1fr);grid-column:1 / -1}.shield{width:54px;height:66px}.defense-formula,.formula-labels{grid-template-columns:auto 38px 38px}.skills-header{display:none}.skill-row{grid-template-columns:22px minmax(0,1fr) 52px 44px 40px;font-size:.82rem}.desc-grid{grid-template-columns:1fr}.desc-portrait{max-width:220px}.tabs{gap:8px}.tab-btn{font-size:.8rem}.game-card{padding:12px}}

  @media(max-width:720px){.sheet-editor-backdrop{padding:8px}.sheet-editor-modal{max-height:96vh;border-radius:18px}.editor-grid{grid-template-columns:1fr}.editor-form-grid{grid-template-columns:1fr}.skill-edit-row{grid-template-columns:1fr 1fr}.skill-edit-head{display:none}.sheet-editor-footer{position:sticky;bottom:0;flex-wrap:wrap}.editor-action{flex:1}.portrait-edit-row{grid-template-columns:60px 1fr}.portrait-edit-preview{width:60px;height:60px;border-radius:15px}}



  /* Painéis juntos: crescem conforme o conteúdo, podem passar da altura da tela e mantêm o mesmo tamanho na mesma linha. */
  @media (min-width:1251px){
    .game-layout{
      align-items:stretch;
      grid-auto-rows:auto;
    }
    .panel{
      height:auto;
      min-height:calc(100vh - 96px);
      max-height:none;
      display:flex;
      flex-direction:column;
      overflow:visible;
    }
    .left-panel{
      overflow:visible;
    }
    .game-layout > .panel:nth-child(2) .skills-list,
    .right-panel .card-list,
    .right-panel .tab-pane.active,
    .right-panel .notes-editor{
      height:auto;
      min-height:0;
      max-height:none;
      overflow:visible;
    }
    .right-panel .tab-pane.active[data-pane="notes"]{
      display:block;
    }
    .right-panel .notes-pane{
      display:grid;
      min-height:0;
    }
    .right-panel .notes-editor{
      min-height:420px;
    }
  }

  /* Em telas empilhadas, cada painel fica com altura automática individual. */
  @media(max-width:1250px){
    .game-layout{
      align-items:start;
      grid-auto-rows:auto;
    }
    .panel{
      height:auto;
      min-height:auto;
      max-height:none;
      overflow:visible;
      display:block;
    }
    .left-panel{
      display:flex;
      overflow:visible;
    }
    .game-layout > .panel:nth-child(2) .skills-list,
    .right-panel .card-list,
    .right-panel .tab-pane.active,
    .right-panel .notes-editor{
      height:auto;
      max-height:none;
      overflow:visible;
    }
  }

</style>

    const key = classKey();

  function parsePair(value, fallback){
    if(value && typeof value === 'object' && 'cur' in value && 'max' in value) return {cur:num(value.cur), max:Math.max(1,num(value.max))};

  function abilityItems(raw, source){

    return trimmed.split(/\n+/).map(line => {

  function abilityLibrary(){

    abilityItems(f.habilidadesTrilha, 'Trilha').forEach(a => addAbilityUnique(list, a, seen));
    if(f.poderOrigem){
      const parts = String(f.poderOrigem).split(/\s+—\s+|\s+-\s+/);
      addAbilityUnique(list, {nex:'Origem', name:parts[0] || 'Poder da origem', desc:parts.slice(1).join(' — '), source:f.origem || 'Origem'}, seen);
    }
    ['abilityLibrary','habilidadesDisponiveis','opcoesHabilidadesClasse','opcoesHabilidadesTrilha'].forEach(key => {
      const raw = sheet && (sheet[key] || fields()[key]);
      if(Array.isArray(raw)) raw.forEach(a => addAbilityUnique(list, normalizeAbility(a, key), seen));

    });
    (sheet.powers || []).forEach(p => addAbilityUnique(list, {name:p.name, desc:p.effect, source:p.source || 'Poder', nex:p.cost || ''}, seen));

  function cleanRich(value){
    const html = String(value || '');
    if(!html) return '';
    const allowed = new Set(['b','strong','i','em','u','br','p','div','ul','ol','li']);
    const box = document.createElement('div');
    box.innerHTML = html;
    function scrub(parent){
      Array.from(parent.childNodes).forEach(node => {
        if(node.nodeType !== 1) return;
        const tag = node.tagName.toLowerCase();
        scrub(node);
        if(!allowed.has(tag)){
          while(node.firstChild) node.parentNode.insertBefore(node.firstChild, node);
          node.remove();
          return;
        }
        Array.from(node.attributes).forEach(attr => node.removeAttribute(attr.name));
      });
    }
    scrub(box);
    return box.innerHTML.trim();
  }
  function formatText(value){
    const text = String(value || '');
    if(!text.trim()) return '';
    if(/<\/?[a-z][\s\S]*>/i.test(text)) return cleanRich(text);
    return safe(text).replace(/\n/g,'<br>');
  }

  function itemLibrary(){
    const data = {};
    ITEM_TABS.forEach(tab => { data[tab] = (DEFAULT_ITEM_LIBRARY[tab] || []).map(item => normalizeItem(item, tab)).filter(Boolean); });
    ['itemLibrary','itensDisponiveis','opcoesItens','itemsLibrary'].forEach(key => {
      const raw = sheet && sheet[key];
      if(!raw) return;
      if(Array.isArray(raw)){
        raw.forEach(item => {
          const normalized = normalizeItem(item, item.category || 'Geral');
          if(!normalized) return;
          const tab = ITEM_TABS.includes(normalized.category) ? normalized.category : 'Geral';
          data[tab].push(normalized);
        });
      }else if(typeof raw === 'object'){
        Object.keys(raw).forEach(tab => {
          const target = ITEM_TABS.includes(tab) ? tab : 'Geral';
          (Array.isArray(raw[tab]) ? raw[tab] : []).forEach(item => {
            const normalized = normalizeItem(item, target);
            if(normalized) data[target].push(normalized);
          });
        });
      }
    });
    return data;
  }

    });
  }

  function attachDynamicHandlers(){
    $('editSheetBtn')?.addEventListener('click', openSheetEditor);
    $('savePlayBtn')?.addEventListener('click', () => { saveFromInputs(); showToast('Ficha de jogo salva', [], 0, 0, 0, 0, 0, true); });
    $('addAbilityBtn')?.addEventListener('click', openAbilityLibraryModal);
    $('newAbilityBtn')?.addEventListener('click', openNewAbilityModal);
    $('addRitualBtn')?.addEventListener('click', openRitualLibraryModal);
    $('newRitualBtn')?.addEventListener('click', openNewRitualModal);
    $('addItemBtn')?.addEventListener('click', openItemLibraryModal);
    $('newItemBtn')?.addEventListener('click', openNewItemModal);
    document.querySelectorAll('[data-notes-cmd]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.execCommand(btn.dataset.notesCmd, false, null);
        const editor = $('notesEditor');
        if(editor){
          editor.focus();
          play.notes = cleanRich(editor.innerHTML);
          savePlay();
        }
      });
    });
    const notesEditor = $('notesEditor');
    if(notesEditor){
      notesEditor.addEventListener('input', () => {
        play.notes = cleanRich(notesEditor.innerHTML);
        savePlay();
      });
      notesEditor.addEventListener('blur', () => {
        play.notes = cleanRich(notesEditor.innerHTML);
        notesEditor.innerHTML = play.notes;
        savePlay();
      });
    }
  }
  function saveFromInputs(){
    play.stats = play.stats || {};
    document.querySelectorAll('[data-play-stat]').forEach(input => { play.stats[input.dataset.playStat] = input.value; });
    const notesEditor = $('notesEditor');
    if(notesEditor) play.notes = cleanRich(notesEditor.innerHTML);
    play.resources = resources;
    savePlay();
  }
  function updateResourceUi(key){
    const box = document.querySelector('[data-resource-box="'+CSS.escape(key)+'"]');
    if(!box) return;
    const r = resources[key] || {cur:0,max:1};
    const pct = Math.max(0, Math.min(100, (num(r.cur)/Math.max(1,num(r.max))) * 100));
    const fill = box.querySelector('.resource-fill');
    if(fill) fill.style.width = pct + '%';
    box.querySelectorAll('[data-res-input]').forEach(input => { input.value = r[input.dataset.resPart]; });
  }
  function rollSkill(name){
    const skill = findSkill(name); if(!skill) return;
    const attr = attrValue(skill.attr || 'attrIntelecto');
    const qty = attr === 0 ? 2 : Math.max(1, attr);
    const rolls = Array.from({length:qty}, () => rand(20));
    const chosen = attr === 0 ? Math.min(...rolls) : Math.max(...rolls);
    const training = num(skill.training), bonus = num(skill.bonus);
    const total = chosen + training + bonus;
    showToast((skill.name || '').toLocaleLowerCase('pt-BR') + ' - ' + total, rolls, chosen, training, bonus, total, false);
  }
  function rollAttribute(key){
    const attr = attrInfo(key);
    const value = attrValue(key);
    const qty = value === 0 ? 2 : Math.max(1, value);
    const rolls = Array.from({length:qty}, () => rand(20));
    const chosen = value === 0 ? Math.min(...rolls) : Math.max(...rolls);
    const total = chosen;
    showToast(attr.name.toLocaleLowerCase('pt-BR') + ' - ' + total, rolls, chosen, 0, 0, total, false);
  }
  function showToast(title, rolls, chosen, training, bonus, total, simple){
    const toast = $('rollToast'); if(!toast) return;
    toast.innerHTML = '<button type="button" aria-label="Fechar">×</button><strong>'+safe(title)+'</strong>' + (simple ? '<span>Alterações salvas neste navegador.</span>' : '<span>( '+safe(rolls.join(', '))+' )</span><span>('+safe(chosen)+' + '+safe(training)+' + '+safe(bonus)+') = '+safe(total)+'</span>');
    toast.classList.add('active');
    toast.querySelector('button').onclick = () => toast.classList.remove('active');
    clearTimeout(toast._timer); toast._timer = setTimeout(()=>toast.classList.remove('active'), simple ? 2500 : 12000);
  }
  document.addEventListener('click', e => {
    const addItem = e.target.closest('[data-add-item-index]');
    if(addItem){
      const idx = Number(addItem.dataset.addItemIndex);
      const item = (activeItemLibrary[activeItemTab] || [])[idx];
      if(item && addItemToSheet(item)) closeAbilityModals();
      return;
    }
    const addRitual = e.target.closest('[data-add-ritual-index]');
    if(addRitual){
      const idx = Number(addRitual.dataset.addRitualIndex);
      const ritual = activeRitualLibrary[idx];
      if(ritual && addRitualToSheet(ritual)) closeAbilityModals();
      return;
    }
    const addAbility = e.target.closest('[data-add-ability-index]');
    if(addAbility){
      const idx = Number(addAbility.dataset.addAbilityIndex);
      const ability = activeAbilityLibrary[idx];
      if(ability && addAbilityToSheet(ability)) closeAbilityModals();
      return;
    }
    const tab = e.target.closest('[data-tab]');
    if(tab){
      const name = tab.dataset.tab;
      document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active', b === tab));
      document.querySelectorAll('[data-pane]').forEach(p=>p.classList.toggle('active', p.dataset.pane === name));
      document.querySelectorAll('[data-toolbar]').forEach(g=>g.classList.toggle('active', g.dataset.toolbar === name));
      return;
    }
    const attrRoll = e.target.closest('[data-roll-attr]');
    if(attrRoll){ e.preventDefault(); rollAttribute(attrRoll.dataset.rollAttr); return; }
    const roll = e.target.closest('[data-roll-skill]');
    if(roll){ e.preventDefault(); rollSkill(roll.dataset.rollSkill); return; }
    const deltaBtn = e.target.closest('[data-res-delta]');
    if(deltaBtn){
      const key = deltaBtn.dataset.res;
      resources[key] = resources[key] || {cur:0,max:1};
      resources[key].cur = Math.max(0, num(resources[key].cur) + num(deltaBtn.dataset.resDelta));
      updateResourceUi(key); saveFromInputs(); return;
    }
  });
  document.addEventListener('input', e => {
    const res = e.target.closest('[data-res-input]');
    if(res){
      const key = res.dataset.resInput;
      const part = res.dataset.resPart;
      resources[key] = resources[key] || {cur:0,max:1};
      resources[key][part] = num(res.value);
      if(part === 'max') resources[key].max = Math.max(1, num(res.value));
      if(part === 'cur') resources[key].cur = Math.max(0, num(res.value));
      updateResourceUi(key); saveFromInputs(); return;
    }
    if(e.target.matches('[data-play-stat]')){
      saveFromInputs();
    }
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeSheetEditor(); closeAbilityModals(); } });
  document.addEventListener('keydown', e => {
    const attrRoll = e.target.closest && e.target.closest('[data-roll-attr]');
    if(attrRoll && (e.key === 'Enter' || e.key === ' ')){
      e.preventDefault();
      rollAttribute(attrRoll.dataset.rollAttr);
    }
  });
  render();
})();
</script>
</body>
</html>
